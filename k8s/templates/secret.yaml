apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
data:
  # Replace with real base64-encoded values at deploy time:
  #   echo -n "your-api-key" | base64
  # Or override via Helm:
  #   helm install ... --set-string secrets.GROQ_API_KEY=$(echo -n $GROQ_API_KEY | base64)
  GROQ_API_KEY: ""
  TAVILY_API_KEY: ""
